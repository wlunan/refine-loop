<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generator-Critic 多 Agent 工作台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    /* 色彩系统 */
    --bg: #f5f6fb;
    --bg-grad-1: #eef1ff;
    --bg-grad-2: #f7f5ff;
    --surface: #ffffff;
    --surface-2: #f8f9fd;
    --surface-3: #f1f3fa;
    --text: #1b1f2d;
    --text-2: #4b5566;
    --muted: #8a93a6;
    --border: #e6e9f2;
    --border-strong: #d7dbea;

    --primary: #6366f1;
    --primary-strong: #4f46e5;
    --primary-soft: rgba(99, 102, 241, 0.10);
    --violet: #8b5cf6;
    --generator: #6366f1;
    --critic: #f59e0b;
    --success: #10b981;
    --danger: #ef4444;

    /* 深色 header */
    --header-1: #17152e;
    --header-2: #2b2563;
    --header-3: #4f46e5;

    /* 圆角 */
    --radius-sm: 8px;
    --radius: 12px;
    --radius-lg: 16px;

    /* 阴影层级 */
    --shadow-xs: 0 1px 2px rgba(23, 21, 46, 0.04);
    --shadow-sm: 0 1px 3px rgba(23, 21, 46, 0.06), 0 1px 2px rgba(23, 21, 46, 0.04);
    --shadow-md: 0 4px 12px rgba(23, 21, 46, 0.07), 0 2px 4px rgba(23, 21, 46, 0.04);
    --shadow-lg: 0 12px 32px rgba(79, 70, 229, 0.14);

    --ring: 0 0 0 3px rgba(99, 102, 241, 0.18);
    --font-sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Microsoft YaHei", "Helvetica Neue", sans-serif;
    --font-mono: "JetBrains Mono", "SFMono-Regular", Consolas, "Liberation Mono", monospace;
  }

  * { box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  body {
    margin: 0;
    font-family: var(--font-sans);
    background:
      radial-gradient(1200px 500px at 85% -10%, var(--bg-grad-1), transparent 60%),
      radial-gradient(1000px 500px at -10% 0%, var(--bg-grad-2), transparent 55%),
      var(--bg);
    color: var(--text);
    line-height: 1.6;
    font-size: 14px;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  /* ---------- 顶部 Header ---------- */
  header {
    position: relative;
    background: linear-gradient(135deg, var(--header-1) 0%, var(--header-2) 55%, var(--header-3) 130%);
    color: #fff;
    box-shadow: var(--shadow-lg);
    overflow: hidden;
  }
  header::after {
    content: "";
    position: absolute;
    inset: 0;
    background:
      radial-gradient(600px 200px at 15% 0%, rgba(139, 92, 246, 0.25), transparent 60%),
      radial-gradient(500px 180px at 90% 20%, rgba(99, 102, 241, 0.30), transparent 60%);
    pointer-events: none;
  }
  .header-inner {
    position: relative;
    z-index: 1;
    max-width: 1400px;
    margin: 0 auto;
    padding: 22px 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
  }
  .logo { display: flex; align-items: center; gap: 14px; }
  .logo-mark {
    width: 44px; height: 44px;
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.12);
    border: 1px solid rgba(255, 255, 255, 0.18);
    backdrop-filter: blur(6px);
    display: flex; align-items: center; justify-content: center;
    gap: 5px;
    flex-shrink: 0;
  }
  .logo-mark span {
    width: 11px; height: 11px; border-radius: 50%;
  }
  .logo-mark .g { background: #a5b4fc; box-shadow: 0 0 12px rgba(165, 180, 252, 0.8); }
  .logo-mark .c { background: #fcd34d; box-shadow: 0 0 12px rgba(252, 211, 77, 0.8); }
  .logo-text h1 {
    margin: 0; font-size: 19px; font-weight: 700; letter-spacing: -0.2px;
    line-height: 1.25;
  }
  .logo-text p {
    margin: 3px 0 0; font-size: 12.5px; opacity: 0.82; letter-spacing: 0.2px;
  }
  .header-badge {
    font-size: 11.5px;
    font-weight: 600;
    letter-spacing: 0.6px;
    text-transform: uppercase;
    padding: 6px 12px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.10);
    border: 1px solid rgba(255, 255, 255, 0.18);
    color: #e0e7ff;
    white-space: nowrap;
  }
  @media (max-width: 640px) {
    .header-inner { flex-direction: column; align-items: flex-start; gap: 12px; }
    .header-badge { display: none; }
  }

  /* ---------- 布局 ---------- */
  .layout {
    display: grid;
    grid-template-columns: 356px 1fr;
    gap: 24px;
    padding: 24px 28px 48px;
    max-width: 1400px;
    margin: 0 auto;
    align-items: start;
  }
  @media (max-width: 980px) {
    .layout { grid-template-columns: 1fr; }
    .panel { position: static !important; }
  }

  /* ---------- 控制面板 ---------- */
  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 22px;
    box-shadow: var(--shadow-sm);
    position: sticky;
    top: 20px;
  }
  .panel h2 {
    margin: 0 0 18px;
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .panel h2::before {
    content: "";
    width: 4px; height: 16px;
    border-radius: 2px;
    background: linear-gradient(180deg, var(--primary), var(--violet));
  }

  .field { margin-bottom: 15px; }
  .field label {
    display: block;
    font-size: 12.5px;
    color: var(--text-2);
    margin-bottom: 7px;
    font-weight: 600;
  }
  .field .required { color: var(--danger); margin-left: 2px; }
  .field textarea, .field input, .field select {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--border-strong);
    border-radius: var(--radius-sm);
    font-size: 13.5px;
    font-family: inherit;
    background: var(--surface-2);
    color: var(--text);
    transition: border-color .18s, box-shadow .18s, background .18s;
  }
  .field textarea { min-height: 150px; resize: vertical; line-height: 1.6; }
  .field textarea:hover, .field input:hover, .field select:hover {
    border-color: #c6cbe0;
  }
  .field textarea:focus, .field input:focus, .field select:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: var(--ring);
    background: #fff;
  }
  .field-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  /* 模式切换 */
  .mode-switch {
    display: flex;
    gap: 4px;
    margin-bottom: 18px;
    padding: 4px;
    background: var(--surface-3);
    border-radius: 11px;
  }
  .mode-btn {
    flex: 1; padding: 9px 8px; border: none; border-radius: 8px;
    background: transparent; color: var(--muted);
    font-size: 13px; font-weight: 600; font-family: inherit; cursor: pointer;
    transition: all .18s;
  }
  .mode-btn:hover { color: var(--text); }
  .mode-btn.active {
    background: #fff; color: var(--primary-strong);
    box-shadow: var(--shadow-xs);
    font-weight: 700;
  }
  .mode-btn:focus-visible { outline: none; box-shadow: var(--ring); }

  /* 主按钮 */
  .btn {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: var(--radius-sm);
    font-size: 14.5px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    color: #fff;
    background: linear-gradient(135deg, var(--primary) 0%, var(--violet) 100%);
    box-shadow: 0 4px 12px rgba(99, 102, 241, 0.30);
    transition: transform .08s, box-shadow .18s, filter .18s;
  }
  .btn:hover { filter: brightness(1.05); box-shadow: 0 6px 16px rgba(99, 102, 241, 0.38); }
  .btn:active { transform: translateY(1px) scale(0.99); }
  .btn:disabled { opacity: 0.55; cursor: not-allowed; box-shadow: none; filter: none; }
  .btn:focus-visible { outline: none; box-shadow: var(--ring); }
  .btn-stop {
    background: #fff;
    color: var(--danger);
    border: 1px solid var(--danger);
    box-shadow: none;
    margin-top: 10px;
  }
  .btn-stop:hover { background: #fff5f5; box-shadow: none; filter: none; }
  .btn-stop:disabled { opacity: 0.4; background: #fff; }

  /* 状态指示 */
  .status {
    display: flex;
    align-items: center;
    gap: 9px;
    font-size: 12.5px;
    color: var(--text-2);
    margin-top: 16px;
    padding: 10px 12px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
  }
  .status-text { font-weight: 500; }
  .dot {
    width: 9px; height: 9px;
    border-radius: 50%;
    background: var(--border-strong);
    flex-shrink: 0;
    position: relative;
  }
  .dot.running { background: var(--success); }
  .dot.running::after {
    content: "";
    position: absolute; inset: -4px;
    border-radius: 50%;
    border: 2px solid var(--success);
    animation: ripple 1.4s ease-out infinite;
  }
  .dot.done { background: var(--success); }
  .dot.error { background: var(--danger); }
  @keyframes ripple {
    0% { transform: scale(0.6); opacity: 0.7; }
    100% { transform: scale(1.6); opacity: 0; }
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
  }

  /* ---------- 主内容区 ---------- */
  .content { min-width: 0; }

  .section-title {
    font-size: 14px;
    font-weight: 700;
    margin: 28px 0 12px;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .section-title:first-child { margin-top: 0; }
  .section-title-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: 0 0 12px;
  }
  .section-title-row .section-title { margin: 0; }
  .round-controls { display: flex; gap: 6px; }
  .ctrl-btn {
    font-size: 12px;
    padding: 6px 12px;
    border: 1px solid var(--border-strong);
    border-radius: var(--radius-sm);
    background: var(--surface);
    color: var(--text-2);
    cursor: pointer;
    font-family: inherit;
    font-weight: 500;
    transition: all .15s;
    min-height: 32px;
  }
  .ctrl-btn:hover {
    border-color: var(--primary);
    color: var(--primary-strong);
    background: var(--primary-soft);
  }
  .ctrl-btn:active { transform: translateY(1px); }
  .ctrl-btn:focus-visible { outline: none; box-shadow: var(--ring); }

  /* 空状态 */
  .empty-tip {
    text-align: center;
    color: var(--muted);
    padding: 64px 20px;
    font-size: 13.5px;
    background: var(--surface);
    border: 1.5px dashed var(--border-strong);
    border-radius: var(--radius-lg);
  }
  .empty-tip .empty-ico {
    display: block;
    width: 46px; height: 46px;
    margin: 0 auto 14px;
    border-radius: 13px;
    background: var(--primary-soft);
    color: var(--primary);
    font-size: 22px;
    line-height: 46px;
  }
  .empty-tip strong { color: var(--text-2); font-weight: 600; }

  /* 轮次卡片 */
  .round-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    margin-bottom: 16px;
    box-shadow: var(--shadow-xs);
    overflow: hidden;
    transition: box-shadow .2s, border-color .2s;
  }
  .round-card:hover { box-shadow: var(--shadow-sm); }
  .round-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 16px;
    font-size: 13.5px;
    font-weight: 600;
    background: var(--surface-2);
    border-bottom: 1px solid var(--border);
    color: var(--text-2);
    cursor: pointer;
    user-select: none;
    transition: background .15s;
  }
  .round-header:hover { background: var(--surface-3); }
  .round-header:focus-visible { outline: none; box-shadow: inset 0 0 0 2px var(--primary); }
  .round-title { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; }
  .round-title .rnum {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 24px; height: 24px; padding: 0 7px;
    border-radius: 7px;
    background: var(--primary-soft);
    color: var(--primary-strong);
    font-size: 12px; font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .round-badges { font-size: 13px; font-weight: 700; color: var(--text); white-space: nowrap; display: flex; align-items: center; gap: 4px; }
  .round-toggle {
    font-size: 13px;
    color: var(--muted);
    transition: transform .18s;
    flex-shrink: 0;
  }
  .round-card.collapsed .round-body { display: none; }
  .round-card.collapsed .round-toggle { transform: rotate(-90deg); }

  .agent-block { padding: 0 16px 4px; }
  .agent-block.generator { border-bottom: 1px solid var(--border); }
  .agent-head {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 13px 0 7px;
    cursor: pointer;
    user-select: none;
    border-radius: 6px;
  }
  .agent-head:focus-visible { outline: none; box-shadow: var(--ring); }
  .agent-head:hover .agent-label { filter: brightness(0.96); }
  .agent-toggle {
    font-size: 12px;
    color: var(--muted);
    transition: transform .18s;
    margin-left: auto;
    flex-shrink: 0;
  }
  .agent-block.collapsed .agent-content { display: none; }
  .agent-block.collapsed .agent-toggle { transform: rotate(-90deg); }
  .agent-label {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-weight: 700;
    padding: 3px 11px;
    border-radius: 999px;
    letter-spacing: .2px;
    transition: filter .15s;
  }
  .agent-label::before {
    content: "";
    width: 7px; height: 7px; border-radius: 50%;
    background: currentColor;
  }
  .generator .agent-label { background: var(--primary-soft); color: var(--generator); }
  .critic .agent-label { background: rgba(245, 158, 11, 0.13); color: #b45309; }

  .agent-content {
    font-size: 13px;
    white-space: pre-wrap;
    word-break: break-word;
    font-family: var(--font-mono);
    line-height: 1.75;
    padding-bottom: 14px;
    color: #303648;
  }
  .critic-content { font-family: var(--font-sans); color: var(--text); }

  .critic-meta { font-size: 14px; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .score {
    font-size: 24px;
    font-weight: 700;
    color: var(--primary);
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.5px;
  }
  .score-ring {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 46px; height: 46px; padding: 0 8px;
    border-radius: 50%;
    background: var(--primary-soft);
    color: var(--primary-strong);
    font-size: 16px; font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .badge {
    display: inline-block;
    font-size: 11.5px;
    font-weight: 700;
    padding: 2px 9px;
    border-radius: 6px;
    margin-left: 4px;
  }
  .badge.ok { background: rgba(16,185,129,0.13); color: #059669; }
  .badge.no { background: rgba(239,68,68,0.12); color: #dc2626; }

  .critic-section-title {
    font-size: 12.5px;
    font-weight: 700;
    color: var(--muted);
    margin: 12px 0 6px;
    letter-spacing: .3px;
    display: flex; align-items: center; gap: 6px;
  }
  .critic-section-title::before { content: ""; width: 3px; height: 12px; border-radius: 2px; background: var(--border-strong); }
  .critic-content ul { margin: 0; padding-left: 20px; }
  .critic-content li { margin-bottom: 5px; font-size: 13.5px; color: var(--text-2); }

  /* 评分趋势 */
  .trend-bar {
    display: flex;
    align-items: flex-end;
    gap: 18px;
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 22px 20px 16px;
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-xs);
    min-height: 128px;
    overflow-x: auto;
  }
  .trend-item { text-align: center; flex: 1; min-width: 52px; max-width: 80px; }
  .trend-value { font-size: 13px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; margin-bottom: 6px; }
  .trend-col {
    height: 92px;
    display: flex;
    align-items: flex-end;
    justify-content: center;
  }
  .trend-bar-inner {
    width: 30px;
    border-radius: 7px 7px 0 0;
    background: linear-gradient(180deg, var(--violet), var(--primary));
    box-shadow: 0 -2px 8px rgba(99, 102, 241, 0.25);
    transition: height .5s cubic-bezier(.22,.8,.36,1);
    min-height: 4px;
  }
  .trend-item:hover .trend-bar-inner { filter: brightness(1.08); }
  .trend-round { font-size: 11.5px; color: var(--muted); margin-top: 8px; white-space: nowrap; }

  /* 文件操作日志 */
  .tool-log {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 14px;
    box-shadow: var(--shadow-xs);
  }
  .tool-entry {
    border: 1px solid var(--border);
    border-radius: 10px;
    margin-bottom: 8px;
    overflow: hidden;
    background: var(--surface-2);
  }
  .tool-entry-head {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 12px;
    font-size: 12px;
    color: var(--muted);
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }
  .tool-name { font-weight: 700; color: var(--primary-strong); font-family: var(--font-mono); }
  .tool-op {
    font-size: 11px; font-weight: 600;
    padding: 1px 7px; border-radius: 5px;
  }
  .tool-op.call { background: var(--primary-soft); color: var(--primary-strong); }
  .tool-op.result { background: rgba(16,185,129,0.12); color: #059669; }
  .tool-round { margin-left: auto; font-variant-numeric: tabular-nums; }
  .tool-entry-body {
    padding: 9px 12px;
    font-size: 12px;
    font-family: var(--font-mono);
    white-space: pre-wrap;
    word-break: break-word;
    color: var(--text);
    max-height: 260px;
    overflow-y: auto;
  }
  .tool-entry-body.args { color: #92600a; background: #fffaf0; }

  /* 最终产出 */
  .final-card {
    background: linear-gradient(135deg, rgba(16,185,129,0.07), rgba(99,102,241,0.07));
    border: 1px solid rgba(16,185,129,0.28);
    border-radius: var(--radius-lg);
    padding: 22px;
    box-shadow: var(--shadow-sm);
  }
  .final-card h3 {
    margin: 0 0 14px;
    font-size: 14px;
    color: #059669;
    display: flex; align-items: center; gap: 8px;
    font-weight: 700;
  }
  .final-card h3::before {
    content: "";
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--success);
    box-shadow: 0 0 0 3px rgba(16,185,129,0.18);
  }
  .final-output {
    white-space: pre-wrap;
    word-break: break-word;
    font-size: 13px;
    line-height: 1.8;
    font-family: var(--font-mono);
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    max-height: 480px;
    overflow-y: auto;
  }
  .final-meta {
    margin-top: 14px;
    font-size: 12.5px;
    color: var(--muted);
    display: flex;
    flex-wrap: wrap;
    gap: 6px 16px;
  }
  .final-meta b { color: var(--text-2); font-weight: 600; font-variant-numeric: tabular-nums; }

  /* 错误框 */
  .error-box {
    background: rgba(239,68,68,0.07);
    border: 1px solid rgba(239,68,68,0.32);
    color: #b91c1c;
    padding: 14px 16px;
    border-radius: 10px;
    font-size: 13.5px;
    margin-bottom: 16px;
    white-space: pre-wrap;
    display: flex; align-items: flex-start; gap: 10px;
  }
  .error-box::before {
    content: "!";
    flex-shrink: 0;
    width: 20px; height: 20px;
    border-radius: 50%;
    background: var(--danger);
    color: #fff;
    font-weight: 700;
    font-size: 13px;
    line-height: 20px;
    text-align: center;
  }

  /* 目录选择器 */
  .browse-row { display: flex; gap: 8px; }
  .browse-row input { flex: 1; min-width: 0; }
  .browse-btn {
    padding: 0 14px;
    border: 1px solid var(--border-strong);
    border-radius: var(--radius-sm);
    background: var(--surface);
    cursor: pointer;
    font-size: 13px;
    white-space: nowrap;
    font-family: inherit;
    font-weight: 500;
    color: var(--text-2);
    transition: all .15s;
    min-height: 38px;
  }
  .browse-btn:hover { border-color: var(--primary); color: var(--primary-strong); background: var(--primary-soft); }
  .browse-btn:focus-visible { outline: none; box-shadow: var(--ring); }
  .browser {
    margin-top: 8px;
    border: 1px solid var(--border-strong);
    border-radius: 10px;
    overflow: hidden;
    display: none;
    box-shadow: var(--shadow-md);
  }
  .browser.open { display: block; }
  .browser-head {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 10px;
    background: var(--surface-2);
    border-bottom: 1px solid var(--border);
  }
  .browser-path {
    flex: 1;
    font-size: 11.5px;
    color: var(--muted);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-family: var(--font-mono);
  }
  .browser-list { max-height: 220px; overflow-y: auto; }
  .browser-item {
    padding: 9px 12px;
    font-size: 13px;
    cursor: pointer;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 8px;
    transition: background .12s;
    color: var(--text-2);
  }
  .browser-item:last-child { border-bottom: none; }
  .browser-item:hover { background: var(--primary-soft); color: var(--primary-strong); }
  .browser-item:focus-visible { outline: none; box-shadow: inset 0 0 0 2px var(--primary); }
  .browser-item .dir-ico { color: var(--primary); font-size: 14px; }

  /* 滚动条 */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb {
    background: #d3d8e6;
    border-radius: 999px;
    border: 2px solid var(--bg);
  }
  ::-webkit-scrollbar-thumb:hover { background: #b9c0d4; }
  * { scrollbar-width: thin; scrollbar-color: #d3d8e6 transparent; }

  /* 无障碍：减少动效偏好 */
  @media (prefers-reduced-motion: reduce) {
    * {
      animation-duration: 0.001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.001ms !important;
      scroll-behavior: auto !important;
    }
  }
</style>
</head>
<body>
  <header>
    <div class="header-inner">
      <div class="logo">
        <div class="logo-mark">
          <span class="g"></span><span class="c"></span>
        </div>
        <div class="logo-text">
          <h1>Generator · Critic</h1>
          <p>生成-批判 多 Agent 协作工作台</p>
        </div>
      </div>
      <div class="header-badge">AI Multi-Agent</div>
    </div>
  </header>

  <main class="layout">
    <!-- 控制面板 -->
    <aside class="panel">
      <h2>任务配置</h2>
      <div class="mode-switch">
        <button class="mode-btn active" id="modeText" onclick="setMode('text')">文本生成</button>
        <button class="mode-btn" id="modeFile" onclick="setMode('file')">文件操作</button>
      </div>
      <div class="field" id="workspaceField" style="display:none">
        <label for="workspace">工作区目录<span class="required">*</span></label>
        <div class="browse-row">
          <input type="text" id="workspace" placeholder="例如 D:\my-project">
          <button type="button" class="browse-btn" onclick="openBrowser()">浏览</button>
        </div>
        <div class="browser" id="browser">
          <div class="browser-head">
            <button type="button" class="ctrl-btn" onclick="browseUp()">↑ 上级</button>
            <span class="browser-path" id="browserPath"></span>
            <button type="button" class="ctrl-btn" onclick="confirmBrowse()">选择此目录</button>
          </div>
          <div class="browser-list" id="browserList"></div>
        </div>
      </div>
      <div class="field">
        <label for="task">任务描述<span class="required">*</span></label>
        <textarea id="task" placeholder="描述你想让 Agent 完成的任务...">设计一个支持百万级日活用户的短视频 App 后端架构方案，要求包含：1. 系统分层架构 2. 视频存储与 CDN 分发 3. 推荐系统链路 4. 数据库选型与分库分表 5. 缓存设计 6. 高可用与容灾方案</textarea>
      </div>
      <div class="field-row">
        <div class="field">
          <label for="domain">领域</label>
          <select id="domain">
            <option value="general">通用</option>
            <option value="code">代码</option>
            <option value="writing">文案</option>
            <option value="design" selected>方案设计</option>
          </select>
        </div>
        <div class="field">
          <label for="maxRounds">最大轮数</label>
          <input type="number" id="maxRounds" value="5" min="1" max="20">
        </div>
      </div>
      <div class="field">
        <label for="threshold">收敛阈值（分数达到即停止）</label>
        <input type="number" id="threshold" value="95" min="0" max="100">
      </div>
      <button class="btn" id="runBtn" onclick="startRun()">开始运行</button>
      <button class="btn btn-stop" id="stopBtn" onclick="stopRun()" disabled>停止</button>
      <div class="status">
        <span class="dot" id="dot"></span>
        <span class="status-text" id="statusText">就绪</span>
      </div>
    </aside>

    <!-- 主内容区 -->
    <section class="content">
      <div id="errorBox" style="display:none"></div>

      <div class="section-title-row">
        <div class="section-title">迭代对话</div>
        <div class="round-controls">
          <button class="ctrl-btn" onclick="setAllExpanded(true)">全部展开</button>
          <button class="ctrl-btn" onclick="setAllExpanded(false)">全部折叠</button>
        </div>
      </div>
      <div id="dialogue">
        <div class="empty-tip" id="emptyTip">
          <span class="empty-ico">✦</span>
          <strong>配置任务后点击「开始运行」</strong><br>
          每轮生成与审查将在这里实时呈现
        </div>
      </div>

      <div class="section-title" id="toolLogTitle" style="display:none">文件操作日志</div>
      <div class="tool-log" id="toolLog" style="display:none"></div>

      <div class="section-title">评分趋势</div>
      <div class="trend-bar" id="trendBar" style="display:none"></div>

      <div class="section-title">最终产出</div>
      <div class="final-card" id="finalCard" style="display:none">
        <h3>最终结果</h3>
        <div class="final-output" id="finalOutput"></div>
        <div class="final-meta" id="finalMeta"></div>
      </div>
    </section>
  </main>

<script>
  let es = null;
  let finished = false;
  let currentRunId = null;
  let mode = 'text';          // 'text' | 'file'
  let browserPath = '';       // 目录选择器当前浏览路径
  const rounds = new Map();   // round -> { gen, critic }
  const scores = [];          // {round, score}

  function setStatus(state, text) {
    const dot = document.getElementById('dot');
    dot.className = 'dot ' + state;
    document.getElementById('statusText').textContent = text;
  }

  function setRunning(running) {
    document.getElementById('runBtn').disabled = running;
    document.getElementById('stopBtn').disabled = !running;
  }

  function showError(msg) {
    const box = document.getElementById('errorBox');
    box.style.display = 'flex';
    box.className = 'error-box';
    box.textContent = msg;
  }

  function clearAll() {
    rounds.clear();
    scores.length = 0;
    currentRunId = null;
    document.getElementById('dialogue').innerHTML =
      '<div class="empty-tip" id="emptyTip"><span class="empty-ico">✦</span>运行中...</div>';
    document.getElementById('trendBar').style.display = 'none';
    document.getElementById('trendBar').innerHTML = '';
    document.getElementById('finalCard').style.display = 'none';
    const toolLog = document.getElementById('toolLog');
    toolLog.innerHTML = '';
    if (mode !== 'file') {
      toolLog.style.display = 'none';
      document.getElementById('toolLogTitle').style.display = 'none';
    }
    const box = document.getElementById('errorBox');
    box.style.display = 'none';
    box.textContent = '';
  }

  function setMode(m) {
    mode = m;
    document.getElementById('modeText').className =
      'mode-btn' + (m === 'text' ? ' active' : '');
    document.getElementById('modeFile').className =
      'mode-btn' + (m === 'file' ? ' active' : '');
    document.getElementById('workspaceField').style.display =
      m === 'file' ? 'block' : 'none';
    if (m !== 'file') {
      document.getElementById('toolLog').style.display = 'none';
      document.getElementById('toolLogTitle').style.display = 'none';
    }
  }

  function openBrowser() {
    browseDir(document.getElementById('workspace').value.trim());
  }

  function browseDir(path) {
    fetch('/api/browse_dir?path=' + encodeURIComponent(path))
      .then(function (r) { return r.json(); })
      .then(function (data) {
        browserPath = data.path || '';
        document.getElementById('browserPath').textContent = browserPath || '(根目录)';
        const list = document.getElementById('browserList');
        list.innerHTML = '';
        if (!data.exists) {
          list.innerHTML = '<div class="browser-item">目录不存在</div>';
        } else if (data.dirs.length === 0) {
          list.innerHTML = '<div class="browser-item">(无子目录)</div>';
        } else {
          data.dirs.forEach(function (d) {
            const item = document.createElement('div');
            item.className = 'browser-item';
            item.tabIndex = 0;
            item.innerHTML = '<span class="dir-ico">📁</span>' + escapeHtml(d);
            item.onclick = function () {
              browseDir(browserPath ? browserPath + '/' + d : d);
            };
            item.onkeydown = function (e) {
              if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); item.onclick(); }
            };
            list.appendChild(item);
          });
        }
        document.getElementById('browser').classList.add('open');
      })
      .catch(function () {
        document.getElementById('browserList').innerHTML =
          '<div class="browser-item">加载失败</div>';
        document.getElementById('browser').classList.add('open');
      });
  }

  function browseUp() {
    fetch('/api/browse_dir?path=' + encodeURIComponent(browserPath))
      .then(function (r) { return r.json(); })
      .then(function (data) {
        if (data.parent) browseDir(data.parent);
      });
  }

  function confirmBrowse() {
    document.getElementById('workspace').value = browserPath;
    document.getElementById('browser').classList.remove('open');
  }

  function handleTool(event) {
    const log = document.getElementById('toolLog');
    log.style.display = 'block';
    document.getElementById('toolLogTitle').style.display = 'block';

    const entry = document.createElement('div');
    entry.className = 'tool-entry';
    const head = document.createElement('div');
    head.className = 'tool-entry-head';
    const isCall = event.subtype === 'tool_call';
    head.innerHTML =
      '<span class="tool-name">' + escapeHtml(event.tool) + '</span>' +
      '<span class="tool-op ' + (isCall ? 'call' : 'result') + '">' +
        (isCall ? '调用' : '结果') + '</span>' +
      '<span class="tool-round">第 ' + event.round + ' 轮</span>';
    const body = document.createElement('div');
    if (isCall) {
      body.className = 'tool-entry-body args';
      body.textContent = JSON.stringify(event.arguments || {});
    } else {
      body.className = 'tool-entry-body';
      body.textContent = event.result || '';
    }
    entry.appendChild(head);
    entry.appendChild(body);
    log.appendChild(entry);
    entry.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }

  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function getRoundCard(round) {
    if (rounds.has(round)) return rounds.get(round);
    const card = document.createElement('div');
    card.className = 'round-card';

    // 轮次头部（可点击折叠整个轮次）
    const header = document.createElement('div');
    header.className = 'round-header';
    header.title = '点击折叠 / 展开本轮';
    header.tabIndex = 0;
    const title = document.createElement('span');
    title.className = 'round-title';
    title.innerHTML = '<span class="rnum">' + round + '</span> 轮迭代';
    const badges = document.createElement('span');
    badges.className = 'round-badges';
    const toggle = document.createElement('span');
    toggle.className = 'round-toggle';
    toggle.textContent = '▾';
    header.appendChild(title);
    header.appendChild(badges);
    header.appendChild(toggle);

    // 轮次主体
    const body = document.createElement('div');
    body.className = 'round-body';

    // Generator 块（头部可点击折叠内容）
    const genBlock = document.createElement('div');
    genBlock.className = 'agent-block generator';
    const genHead = document.createElement('div');
    genHead.className = 'agent-head';
    genHead.title = '点击折叠 / 展开生成内容';
    genHead.tabIndex = 0;
    genHead.innerHTML =
      '<span class="agent-label">Generator 生成</span>' +
      '<span class="agent-toggle">▾</span>';
    const genContent = document.createElement('div');
    genContent.className = 'agent-content gen-content';
    genBlock.appendChild(genHead);
    genBlock.appendChild(genContent);

    // Critic 块
    const criticBlock = document.createElement('div');
    criticBlock.className = 'agent-block critic';
    const criticHead = document.createElement('div');
    criticHead.className = 'agent-head';
    criticHead.title = '点击折叠 / 展开审查内容';
    criticHead.tabIndex = 0;
    criticHead.innerHTML =
      '<span class="agent-label">Critic 审查</span>' +
      '<span class="agent-toggle">▾</span>';
    const criticContent = document.createElement('div');
    criticContent.className = 'agent-content critic-content';
    criticBlock.appendChild(criticHead);
    criticBlock.appendChild(criticContent);

    body.appendChild(genBlock);
    body.appendChild(criticBlock);
    card.appendChild(header);
    card.appendChild(body);

    const tip = document.getElementById('emptyTip');
    if (tip) tip.remove();
    document.getElementById('dialogue').appendChild(card);

    header.onclick = function () { toggleRound(round); };
    header.onkeydown = function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleRound(round); }
    };
    genHead.onclick = function () { toggleAgent(round, 'gen'); };
    genHead.onkeydown = function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleAgent(round, 'gen'); }
    };
    criticHead.onclick = function () { toggleAgent(round, 'critic'); };
    criticHead.onkeydown = function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleAgent(round, 'critic'); }
    };

    const obj = {
      card, body, header, badges, toggle,
      genBlock, genContent,
      criticBlock, criticContent,
    };
    rounds.set(round, obj);
    return obj;
  }

  function autoScroll() {
    const card = document.querySelector('.round-card:last-child .gen-content');
    if (card && card.offsetParent !== null) {
      card.scrollIntoView({ block: 'end', behavior: 'smooth' });
    }
  }

  function toggleRound(round) {
    const r = rounds.get(round);
    if (!r) return;
    setRoundExpanded(round, r.card.classList.contains('collapsed'));
  }

  function setRoundExpanded(round, expanded) {
    const r = rounds.get(round);
    if (!r) return;
    r.card.classList.toggle('collapsed', !expanded);
  }

  function toggleAgent(round, which) {
    const r = rounds.get(round);
    if (!r) return;
    const block = which === 'gen' ? r.genBlock : r.criticBlock;
    block.classList.toggle('collapsed');
  }

  function setAgentExpanded(round, which, expanded) {
    const r = rounds.get(round);
    if (!r) return;
    const block = which === 'gen' ? r.genBlock : r.criticBlock;
    block.classList.toggle('collapsed', !expanded);
  }

  function setAllExpanded(expanded) {
    rounds.forEach(function (_, round) { setRoundExpanded(round, expanded); });
  }

  function handleToken(round, token) {
    const r = getRoundCard(round);
    // 流式输出时自动保持本轮与生成内容展开，方便实时观看
    setRoundExpanded(round, true);
    setAgentExpanded(round, 'gen', true);
    r.genContent.textContent += token;
    autoScroll();
  }

  function handleCritic(data) {
    const r = getRoundCard(data.round);
    const badge = data.acceptable
      ? '<span class="badge ok">可接受</span>'
      : '<span class="badge no">需修改</span>';
    r.badges.innerHTML = '评分 ' + data.score + ' ' + badge;
    let html = '<div class="critic-meta"><span class="score-ring">' + data.score +
      '</span><span style="color:var(--muted)">/ 100</span>' + badge + '</div>';
    if (data.issues && data.issues.length) {
      html += '<div class="critic-section-title">问题</div><ul>' +
        data.issues.map(function(i){ return '<li>' + escapeHtml(i) + '</li>'; }).join('') +
        '</ul>';
    } else {
      html += '<div class="critic-section-title">问题</div><div style="color:var(--muted)">无</div>';
    }
    if (data.suggestions && data.suggestions.length) {
      html += '<div class="critic-section-title">建议</div><ul>' +
        data.suggestions.map(function(s){ return '<li>' + escapeHtml(s) + '</li>'; }).join('') +
        '</ul>';
    }
    if (data.summary) {
      html += '<div class="critic-section-title">总结</div><div style="color:var(--text-2)">' + escapeHtml(data.summary) + '</div>';
    }
    r.criticContent.innerHTML = html;
    addScore(data.round, data.score);
  }

  function addScore(round, score) {
    scores.push({ round: round, score: score });
    renderTrend();
  }

  function renderTrend() {
    const bar = document.getElementById('trendBar');
    bar.style.display = 'flex';
    bar.innerHTML = scores.map(function(s) {
      return '<div class="trend-item">' +
        '<div class="trend-value">' + s.score + '</div>' +
        '<div class="trend-col"><div class="trend-bar-inner" style="height:' + s.score + '%"></div></div>' +
        '<div class="trend-round">第' + s.round + '轮</div>' +
      '</div>';
    }).join('');
  }

  function handleDone(data) {
    const finalCard = document.getElementById('finalCard');
    finalCard.style.display = 'block';
    document.getElementById('finalOutput').textContent = data.final_output;
    document.getElementById('finalMeta').innerHTML =
      '<span>迭代轮数 <b>' + data.iterations + '</b></span>' +
      '<span>收敛 <b>' + (data.converged ? '是' : '否') + '</b></span>' +
      '<span>耗时 <b>' + data.total_time + 's</b></span>' +
      '<span>' + escapeHtml(data.convergence_reason) + '</span>';
  }

  function handleEvent(event) {
    switch (event.type) {
      case 'run_id':
        currentRunId = event.run_id;
        break;
      case 'status':
        setStatus('running', event.message);
        break;
      case 'token':
        handleToken(event.round, event.token);
        break;
      case 'tool':
        handleTool(event);
        break;
      case 'critic':
        handleCritic(event);
        break;
      case 'done':
        handleDone(event);
        break;
      case 'error':
        showError(event.message);
        setStatus('error', '出错');
        break;
      case 'end':
        finished = true;
        setStatus('done', '完成');
        setRunning(false);
        if (es) { es.close(); es = null; }
        break;
    }
  }

  function startRun() {
    const task = document.getElementById('task').value.trim();
    if (!task) { alert('请输入任务描述'); return; }

    const domain = document.getElementById('domain').value;
    const maxRounds = document.getElementById('maxRounds').value;
    const threshold = document.getElementById('threshold').value;

    let url;
    if (mode === 'file') {
      const workspace = document.getElementById('workspace').value.trim();
      if (!workspace) { alert('请选择工作区目录'); return; }
      url = '/api/stream_files?task=' + encodeURIComponent(task) +
        '&workspace=' + encodeURIComponent(workspace) +
        '&domain=' + encodeURIComponent(domain) +
        '&max_rounds=' + encodeURIComponent(maxRounds) +
        '&threshold=' + encodeURIComponent(threshold);
    } else {
      url = '/api/stream?task=' + encodeURIComponent(task) +
        '&domain=' + encodeURIComponent(domain) +
        '&max_rounds=' + encodeURIComponent(maxRounds) +
        '&threshold=' + encodeURIComponent(threshold);
    }

    clearAll();
    if (mode === 'file') {
      document.getElementById('toolLog').style.display = 'block';
      document.getElementById('toolLogTitle').style.display = 'block';
    }
    finished = false;
    setRunning(true);
    setStatus('running', '正在连接...');

    es = new EventSource(url);
    es.onmessage = function(e) {
      try { handleEvent(JSON.parse(e.data)); }
      catch (err) { /* 忽略无法解析的片段 */ }
    };
    es.onerror = function() {
      if (!finished) {
        showError('连接中断或服务出错，请检查后端是否正常运行');
        setStatus('error', '连接中断');
        setRunning(false);
        if (es) { es.close(); es = null; }
      }
    };
  }

  function stopRun() {
    // 通知后端真正中断后台迭代
    if (currentRunId) {
      fetch('/api/stop?run_id=' + encodeURIComponent(currentRunId), { method: 'POST' })
        .catch(function () { /* 忽略网络错误 */ });
    }
    if (es) { es.close(); es = null; }
    finished = true;
    setStatus('done', '已停止');
    setRunning(false);
  }
</script>
</body>
</html>
